[workspace]
resolver = "2"
members = [
    "crates/studio-project",
    "crates/studio-engine",
    "crates/forge3d-studio",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

# The shipped binary is stripped: debug symbols are 20+ MiB of the 86 MiB and
# nothing in the workbench reads them at runtime. `strip` is cheap (no LTO, no
# codegen-units change), so the release build stays a ~48 s incremental.
# Backtraces from a released build still carry addresses; use a debug build to
# symbolise.
[profile.release]
strip = "symbols"

# Middle ground for iteration: optimised enough to measure real frame times
# (~6-10 ms instead of 24 ms), but without the release build's full cost.
# `cargo build --profile devopt -p forge3d-studio`.
[profile.devopt]
inherits = "release"
opt-level = 1
lto = "off"
codegen-units = 16
strip = "symbols"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }

# GPUI Kit is the whole UI framework: GPUI (Zed's GPU-accelerated runtime),
# gpui-base (behavior/state) and gpui-component (the styled system: dock,
# tree, table, inputs, command palette, status bar). The UI shell is built
# against it — one runtime, no second UI path.
#
# GPUI renders through wgpu 30, while forge3d (and therefore studio-engine's
# native viewport) is built on wgpu 0.19. The two versions cannot share a
# device, so the interactive terrain frame is read back from the engine's own
# device and presented as an image — see studio-engine::ViewportWorker.
gpui-kit = "0.8"

# The engine lives in the parent repository checkout. We enable its
# `extension-module` feature — the exact configuration the Python wheel is
# built with — because the native terrain renderer tree (terrain::renderer)
# is only compiled under that feature. The Studio binary embeds libpython
# symbols (linked in crates/forge3d-studio/build.rs) but never initializes
# the interpreter: it drives TerrainScene, a plain Rust API.
forge3d = { path = "..", features = ["extension-module"] }

studio-project = { path = "crates/studio-project" }
studio-engine = { path = "crates/studio-engine" }
