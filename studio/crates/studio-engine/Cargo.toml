[package]
name = "studio-engine"
description = "Forge3D engine integration layer for Studio: embedded-Python worker driving the certified TerrainRenderer pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
pyo3-build-config = "0.21"

[dependencies]
studio-project.workspace = true
# M10: the interactive viewport renders through the engine's own Rust surface
# on the wgpu device eframe presents with.
forge3d.workspace = true
wgpu = "0.19"
image.workspace = true
log.workspace = true
env_logger.workspace = true
# Embedded Python drives forge3d's certified TerrainRenderer entry point.
pyo3 = "0.21"
numpy = "0.21"
# Bridge v2 op/results envelope.
serde_json = "1"

[dev-dependencies]
serde.workspace = true
image.workspace = true
env_logger.workspace = true
