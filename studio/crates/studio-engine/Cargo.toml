[package]
name = "studio-engine"
description = "Forge3D engine integration layer for Studio: embedded-Python worker driving the certified TerrainRenderer pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
pyo3-build-config = "0.21"

[dependencies]
studio-project.workspace = true
# The interactive viewport renders through the engine's own Rust surface on the
# engine's negotiated wgpu context, then hands the UI pixels (see
# native_viewport.rs for why the boundary is a readback).
forge3d.workspace = true
wgpu = { version = "0.19", features = ["wgsl"] }
# 3D grid matrices; must match the engine's viewer maths exactly.
glam = "0.24"
bytemuck = { version = "1", features = ["derive"] }
image.workspace = true
log.workspace = true
env_logger.workspace = true
# Embedded Python drives forge3d's certified TerrainRenderer entry point.
pyo3 = "0.21"
numpy = "0.21"
# Bridge v2 op/results envelope.
serde_json = "1"

[dev-dependencies]
serde.workspace = true
image.workspace = true
env_logger.workspace = true
sha2 = "0.10"
