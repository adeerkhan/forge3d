[package]
name = "forge3d-studio"
description = "Forge3D Studio: cross-platform desktop application for the Forge3D rendering engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "forge3d-studio"
path = "src/main.rs"

[build-dependencies]
pyo3-build-config = "0.21"

[dependencies]
serde.workspace = true
serde_json.workspace = true
glam = "0.24"
image.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
resvg.workspace = true
log.workspace = true
env_logger.workspace = true
studio-project.workspace = true
studio-engine.workspace = true
