# Pin the Python interpreter used by pyo3's build script. forge3d depends on
# pyo3 even as a pure-Rust library (without `extension-module` it links
# libpython), so development headers must exist. The engine checkout keeps a
# uv-managed venv with full headers at ../.venv; system python3 on some
# distros ships without headers and would break the build.
[env]
PYO3_PYTHON = { value = "../.venv/bin/python", relative = true }
VIRTUAL_ENV = { value = "../.venv", relative = true }
# pyo3 0.21 officially tops out at Python 3.12; the engine checkout's venv is
# 3.13, which works fine for the C-API subset pyo3 uses.
PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1"
